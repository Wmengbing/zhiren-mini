name: Project checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: admin
      - run: npm run build
        working-directory: admin
      - run: node deploy/tests/mini-state.cjs
